name: Launch Runner

on:
  repository_dispatch:
    types:
      - runner_start

jobs:
  forward:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.target.outputs.runs_on }}
      os_label: ${{ steps.target.outputs.os_label }}
      extra_labels: ${{ steps.target.outputs.extra_labels }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target OS and labels
        id: target
        run: |
          RAW_OS="${{ github.event.client_payload.os }}"
          EXTRA_LABELS="${{ github.event.client_payload.labels }}"

          case "${RAW_OS,,}" in
            ""|"linux"|"ubuntu"|"ubuntu-latest")
              RUNS_ON="ubuntu-latest"
              OS_LABEL="ubuntu-latest,ubuntu-22.04,ubuntu-24.04,linux"
              ;;
            "ubuntu-22.04"|"ubuntu-24.04")
              RUNS_ON="${RAW_OS,,}"
              OS_LABEL="${RAW_OS,,},ubuntu-latest,linux"
              ;;
            "mac"|"macos"|"osx"|"macos-latest")
              RUNS_ON="macos-latest"
              OS_LABEL="macos-latest,macos"
              ;;
            "macos-13"|"macos-14"|"macos-15")
              RUNS_ON="${RAW_OS,,}"
              OS_LABEL="${RAW_OS,,},macos-latest,macos"
              ;;
            "win"|"windows"|"windows-latest")
              RUNS_ON="windows-latest"
              OS_LABEL="windows-latest,windows"
              ;;
            "windows-2022"|"windows-2025")
              RUNS_ON="${RAW_OS,,}"
              OS_LABEL="${RAW_OS,,},windows-latest,windows"
              ;;
            *)
              RUNS_ON="${RAW_OS}"
              OS_LABEL="${RAW_OS}"
              ;;
          esac

          echo "runs_on=${RUNS_ON}" >> "$GITHUB_OUTPUT"
          echo "os_label=${OS_LABEL}" >> "$GITHUB_OUTPUT"
          echo "extra_labels=${EXTRA_LABELS}" >> "$GITHUB_OUTPUT"
          echo "Target runner OS: ${RUNS_ON} (labels: ${OS_LABEL} ${EXTRA_LABELS})"

      - name: import keys
        if: vars.USE_GOPASS_QUOTA == 'true'
        env:
          GPG: ${{ secrets.GPG }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG" ]; then
            echo "No GPG secret configured; skipping Gopass setup."
            exit 0
          fi
          sudo apt update && sudo apt install -yq pinentry-tty
          echo "$GPG" > /tmp/tempkey.asc
          echo ${GPG_PASSPHRASE}| gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback --import <(cat /tmp/tempkey.asc)
          echo ${GPG_PASSPHRASE}| gpg --batch --pinentry-mode loopback --passphrase-fd 0 --sign --output /dev/null /dev/null > /dev/null 2>&1

      - name: install store
        if: vars.USE_GOPASS_QUOTA == 'true'
        env:
          GOPASS_STORE: ${{ secrets.GOPASS_STORE }}
        run: |
          if [ -z "$GOPASS_STORE" ]; then
            echo "No GOPASS_STORE secret configured; skipping store clone."
            exit 0
          fi
          curl https://packages.gopass.pw/repos/gopass/gopass-archive-keyring.gpg | sudo tee /usr/share/keyrings/gopass-archive-keyring.gpg >/dev/null
          cat << EOF | sudo tee /etc/apt/sources.list.d/gopass.sources
          Types: deb
          URIs: https://packages.gopass.pw/repos/gopass
          Suites: stable
          Architectures: all amd64 arm64 armhf
          Components: main
          Signed-By: /usr/share/keyrings/gopass-archive-keyring.gpg
          EOF
          sudo apt update && sudo apt install -qy gopass gopass-archive-keyring

          git clone -b master ${GOPASS_STORE} ~/.password-store

          cd ~/.password-store

          git config user.email "bot@github-action.com"
          git config user.name "Bot Action"

          gopass --yes --nosync sync

      - name: quota
        run: |
          export ACCESS_TOKEN="${{ github.event.client_payload.access_token }}"
          export REPOSITORY="${{ github.event.client_payload.repository }}"
          export TARGET_OS="${{ steps.target.outputs.runs_on }}"
          export EXTRA_LABELS="${{ steps.target.outputs.extra_labels }}"
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPOSITORY" ]; then
            echo "Error: ACCESS_TOKEN o REPOSITORY empty"
            exit 1
          fi

          if command -v gopass >/dev/null 2>&1 && [ -d ~/.password-store ]; then
            export GH_TOKEN=$(gopass show --password -n -f github/action/runner/config/${GITHUB_REPOSITORY}/admin/access_token 2>/dev/null || true)
            export FORWARD_ADMIN_ACCESS_TOKEN=$(gopass show --password -n -f github/action/runner/config/${GITHUB_REPOSITORY}/forward/access_token 2>/dev/null || true)
            export FORWARD_ADMIN_REPOSITORY=$(gopass show --password -n -f github/action/runner/config/${GITHUB_REPOSITORY}/forward/repository 2>/dev/null || true)
          fi

          USERNAME=$(gh api user 2>/dev/null | jq -r '.login // empty' || true)
          if [ -n "$USERNAME" ]; then
            LIMITS=$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "/users/${USERNAME}/settings/billing/actions" 2>/dev/null || echo '{"total_minutes_used":0,"included_minutes":2000}')
          else
            echo "Warning: Could not query billing API (token expired or public repo); assuming quota available."
            LIMITS='{"total_minutes_used":0,"included_minutes":2000}'
          fi
          USED=$(printf "%.0f" "$(echo "$LIMITS" | jq -r '.total_minutes_used // 0')")
          FREE=$(printf "%.0f" "$(echo "$LIMITS" | jq -r '.included_minutes // 2000')")

          if [ "$USED" -lt "$FREE" ]; then
            echo "USED $USED is less than FREE $FREE"
          elif [ -n "${FORWARD_ADMIN_ACCESS_TOKEN}" ] && [ -n "${FORWARD_ADMIN_REPOSITORY}" ]; then
            echo "USED $USED is greater or equal than FREE $FREE"
            curl -X POST \
              -H "Authorization: token ${FORWARD_ADMIN_ACCESS_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${FORWARD_ADMIN_REPOSITORY}/dispatches \
              -d "$(echo '{"event_type": "runner_start", "client_payload": {"repository": "'"${REPOSITORY}"'", "access_token": "'"${ACCESS_TOKEN}"'", "os": "'"${TARGET_OS}"'", "labels": "'"${EXTRA_LABELS}"'"}}')"
            exit 127
          fi

      - name: teardown
        if: always()
        run: |
          rm -rf ~/.password-store
          rm -rf ~/.local/share/gopass
          rm -rf ~/.config/gopass
          gpgconf --kill gpg-agent > /dev/null 2>&1 || true

  launch:
    runs-on: ${{ needs.forward.outputs.runs_on || 'ubuntu-latest' }}
    needs:
      - forward
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Connect & Run Ephemeral Runner (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ACCESS_TOKEN: ${{ github.event.client_payload.access_token }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
          OS_LABEL: ${{ needs.forward.outputs.os_label }}
          EXTRA_LABELS: ${{ needs.forward.outputs.extra_labels }}
        run: |
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPOSITORY" ]; then
            echo "Error: ACCESS_TOKEN or REPOSITORY empty"
            exit 1
          fi

          mkdir -p "$HOME/actions-runner"
          cd "$HOME/actions-runner"

          if [ "${RUNNER_OS}" = "macOS" ]; then
            PKG_OS="osx"
          else
            PKG_OS="linux"
          fi

          ARCH=$(uname -m)
          case "$ARCH" in
            arm64|aarch64) PKG_ARCH="arm64" ;;
            *) PKG_ARCH="x64" ;;
          esac

          RUNNER_VERSION=$(curl -fsSL -H "Authorization: token ${ACCESS_TOKEN}" https://api.github.com/repos/actions/runner/releases/latest 2>/dev/null | jq -r '.tag_name // empty' | sed 's/^v//' || true)
          if [ -z "$RUNNER_VERSION" ] || [ "$RUNNER_VERSION" = "null" ]; then
            RUNNER_VERSION="2.322.0"
          fi

          TARBALL="actions-runner-${PKG_OS}-${PKG_ARCH}-${RUNNER_VERSION}.tar.gz"
          echo "Downloading ${TARBALL}..."
          curl -fsSL -o "${TARBALL}" -L "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/${TARBALL}"
          tar xzf "./${TARBALL}"

          REG_TOKEN=$(curl -fsSL -X POST \
            -H "Authorization: token ${ACCESS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runners/registration-token" | jq -r .token)

          LABELS="${OS_LABEL}"
          if [ -n "${EXTRA_LABELS}" ]; then
            LABELS="${LABELS},${EXTRA_LABELS}"
          fi

          RUNNER_NAME="hosted-${PKG_OS}-${PKG_ARCH}-${GITHUB_RUN_ID}-${RANDOM}"

          cleanup() {
            echo "Removing runner ${RUNNER_NAME}..."
            ./config.sh remove --token "${REG_TOKEN}" || true
          }

          trap cleanup EXIT SIGINT SIGTERM

          export GH_REPO="${REPOSITORY}"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            ./config.sh --unattended \
              --url "https://github.com/${REPOSITORY}" \
              --token "${REG_TOKEN}" \
              --name "${RUNNER_NAME}" \
              --labels "${LABELS}" \
              --replace

            ./run.sh &
            RUNNER_PID=$!
            RAN_JOB=0
            IDLE_AFTER_JOB=0
            while kill -0 "$RUNNER_PID" 2>/dev/null; do
              if pgrep -f "Runner.Worker" >/dev/null 2>&1; then
                RAN_JOB=1
                IDLE_AFTER_JOB=0
              elif [ "$RAN_JOB" -eq 1 ]; then
                IDLE_AFTER_JOB=$((IDLE_AFTER_JOB + 1))
                if [ "$IDLE_AFTER_JOB" -ge 6 ]; then
                  echo "macOS runner idle for 30s after completing job(s); shutting down."
                  kill "$RUNNER_PID" 2>/dev/null || true
                  break
                fi
              fi
              sleep 5
            done
            wait "$RUNNER_PID" || true
          else
            ./config.sh --unattended \
              --url "https://github.com/${REPOSITORY}" \
              --token "${REG_TOKEN}" \
              --name "${RUNNER_NAME}" \
              --labels "${LABELS}" \
              --replace \
              --ephemeral

            ./run.sh
          fi

      - name: Connect & Run Ephemeral Runner (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ACCESS_TOKEN: ${{ github.event.client_payload.access_token }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
          OS_LABEL: ${{ needs.forward.outputs.os_label }}
          EXTRA_LABELS: ${{ needs.forward.outputs.extra_labels }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrEmpty($env:ACCESS_TOKEN) -or [string]::IsNullOrEmpty($env:REPOSITORY)) {
            Write-Error "Error: ACCESS_TOKEN or REPOSITORY empty"
            exit 1
          }

          $runnerDir = Join-Path $env:USERPROFILE "actions-runner"
          New-Item -ItemType Directory -Force -Path $runnerDir | Out-Null
          Set-Location $runnerDir

          try {
            $latest = Invoke-RestMethod -Uri "https://api.github.com/repos/actions/runner/releases/latest"
            $runnerVersion = $latest.tag_name.TrimStart('v')
          } catch {
            $runnerVersion = "2.322.0"
          }

          $zipFile = "actions-runner-win-x64-$runnerVersion.zip"
          $downloadUrl = "https://github.com/actions/runner/releases/download/v$runnerVersion/$zipFile"
          Write-Host "Downloading $zipFile..."
          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipFile
          Expand-Archive -Path $zipFile -DestinationPath $runnerDir -Force

          $headers = @{
            "Authorization" = "token $($env:ACCESS_TOKEN)"
            "Accept"        = "application/vnd.github+json"
          }
          $regResponse = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$($env:REPOSITORY)/actions/runners/registration-token" -Headers $headers
          $regToken = $regResponse.token

          $labels = $env:OS_LABEL
          if (-not [string]::IsNullOrEmpty($env:EXTRA_LABELS)) {
            $labels = "$labels,$($env:EXTRA_LABELS)"
          }

          $rand = Get-Random -Minimum 1000 -Maximum 9999
          $runnerName = "hosted-win-x64-$($env:GITHUB_RUN_ID)-$rand"

          try {
            & .\config.cmd --unattended `
              --url "https://github.com/$($env:REPOSITORY)" `
              --token $regToken `
              --name $runnerName `
              --labels $labels `
              --replace `
              --ephemeral

            & .\run.cmd
          } finally {
            Write-Host "Removing runner $runnerName..."
            & .\config.cmd remove --token $regToken
          }
