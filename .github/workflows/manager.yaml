name: Launch Runner

on:
  repository_dispatch:
    types:
      - runner_start

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: import keys
        env:
          GPG: ${{ secrets.GPG }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          sudo apt update && sudo apt install -yq pinentry-tty
          echo "$GPG" > /tmp/tempkey.asc
          echo ${GPG_PASSPHRASE}| gpg --batch --yes --passphrase-fd 0 --pinentry-mode loopback --import <(cat /tmp/tempkey.asc)
          echo ${GPG_PASSPHRASE}| gpg --batch --pinentry-mode loopback --passphrase-fd 0 --sign --output /dev/null /dev/null > /dev/null 2>&1
      - name: install store
        env:
          GOPASS_STORE: ${{ secrets.GOPASS_STORE }}
        run: |
          curl https://packages.gopass.pw/repos/gopass/gopass-archive-keyring.gpg | sudo tee /usr/share/keyrings/gopass-archive-keyring.gpg >/dev/null
          cat << EOF | sudo tee /etc/apt/sources.list.d/gopass.sources
          Types: deb
          URIs: https://packages.gopass.pw/repos/gopass
          Suites: stable
          Architectures: all amd64 arm64 armhf
          Components: main
          Signed-By: /usr/share/keyrings/gopass-archive-keyring.gpg
          EOF
          sudo apt update && sudo apt install -qy gopass gopass-archive-keyring

          git clone -b master ${GOPASS_STORE} ~/.password-store

          cd ~/.password-store

          git config user.email "bot@github-action.com"
          git config user.name "Bot Action"

          gopass --yes --nosync sync
      - name: quota
        run: |
          export ACCESS_TOKEN="${{ github.event.client_payload.access_token }}"
          export REPOSITORY="${{ github.event.client_payload.repository }}"
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPOSITORY" ]; then
            echo "Error: ACCESS_TOKEN o REPOSITORY empty"
            exit 1
          fi

          export GH_TOKEN=$(gopass show --password -n -f github/action/runner/config/${GITHUB_REPOSITORY}/admin/access_token 2>/dev/null || true)
          export FORWARD_ADMIN_ACCESS_TOKEN=$(gopass show --password -n -f github/action/runner/config/${GITHUB_REPOSITORY}/forward/access_token 2>/dev/null || true)
          export FORWARD_ADMIN_REPOSITORY=$(gopass show --password -n -f github/action/runner/config/${GITHUB_REPOSITORY}/forward/repository 2>/dev/null || true)
          USERNAME=$(gh api user 2>/dev/null | jq -r '.login // empty' || true)
          if [ -n "$USERNAME" ]; then
            LIMITS=$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "/users/${USERNAME}/settings/billing/actions" 2>/dev/null || echo '{"total_minutes_used":0,"included_minutes":2000}')
          else
            echo "Warning: Could not query billing API (token expired or public repo); assuming quota available."
            LIMITS='{"total_minutes_used":0,"included_minutes":2000}'
          fi
          USED=$(printf "%.0f" "$(echo "$LIMITS" | jq -r '.total_minutes_used // 0')")
          FREE=$(printf "%.0f" "$(echo "$LIMITS" | jq -r '.included_minutes // 2000')")

          if [ "$USED" -lt "$FREE" ]; then
            echo "USED $USED is less than FREE $FREE"
          elif [ -n "${FORWARD_ADMIN_ACCESS_TOKEN}" ] && [ -n "${FORWARD_ADMIN_REPOSITORY}" ]; then
            echo "USED $USED is greater or equal than FREE $FREE"
            curl -X POST \
              -H "Authorization: token ${FORWARD_ADMIN_ACCESS_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${FORWARD_ADMIN_REPOSITORY}/dispatches \
              -d "$(echo '{"event_type": "runner_start", "client_payload": {"repository": "'"${REPOSITORY}"'", "access_token": "'"${ACCESS_TOKEN}"'"}}')"
            exit 127
          fi
      - name: teardown
        run: |
          rm -rf ~/.password-store
          rm -rf ~/.local/share/gopass
          rm -rf ~/.config/gopass
          gpgconf --kill gpg-agent > /dev/null 2>&1

  launch:
    runs-on: ubuntu-latest
    needs:
      - forward
    permissions:
      id-token: write
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: connect
        run: |
          mkdir -p $HOME/runner
          cd $HOME/runner
          RUNNER_VERSION=$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          if [ -z "$RUNNER_VERSION" ] || [ "$RUNNER_VERSION" = "null" ]; then
            RUNNER_VERSION="2.322.0"
          fi
          echo "Downloading actions-runner v${RUNNER_VERSION}..."
          curl -o actions-runner-linux-x64.tar.gz -L "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
          tar xzf ./actions-runner-linux-x64.tar.gz
      - name: run
        run: |
          echo "${{ toJson(github.event) }}"
          export ACCESS_TOKEN="${{ github.event.client_payload.access_token }}"
          export REPOSITORY="${{ github.event.client_payload.repository }}"
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REPOSITORY" ]; then
            echo "Error: ACCESS_TOKEN o REPOSITORY empty"
            exit 1
          fi
          
          REG_TOKEN=$(curl -X POST -H "Authorization: token ${ACCESS_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${REPOSITORY}/actions/runners/registration-token | jq .token --raw-output)
          cd /home/runner/runner
          
          ./config.sh --unattended --url https://github.com/${REPOSITORY} --token ${REG_TOKEN} --replace --ephemeral --pat "${ACCESS_TOKEN}"
          
          cleanup() {
            echo "Removing runner..."
            ./config.sh remove --token ${REG_TOKEN}
          }
          
          trap cleanup EXIT SIGINT SIGTERM
          
          ./run.sh
